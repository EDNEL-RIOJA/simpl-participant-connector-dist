filebeat:
  image: ghcr.io/cnie-es/beats-filebeat
  imageTag: ''
  resources:
    requests:
      memory: 100Mi
      cpu: 10m
    limits:
      memory: 1Gi
      cpu: 100m
  ilm:
    hot:
      max_age: 7d
      max_primary_shard_size: 1gb
    delete:
      min_age: 14d
  minimal_stack_ilm:
    hot:
      max_age: 3h
      max_primary_shard_size: 100mb
    delete:
      min_age: 24h
  cert:
    duration: 2160h0m0s
    renewBefore: 360h0m0s
  input: "filebeat.autodiscover:\n  providers:\n    - type: kubernetes\n      # Filter
    logs only from the monitored namespace\n      namespace: \"${MONITORED_NAMESPACE}\"\n
    \     templates:\n        # Condition for redis container in the monitored namespace\n
    \       - condition.equals.kubernetes.container.name: \"redis\"\n          config:\n
    \           - type: filestream\n              id: redis-logs-${data.kubernetes.container.id}\n
    \             paths:\n                - /var/log/containers/*${data.kubernetes.container.id}.log\n
    \             parsers:\n                - container:\n                    stream:
    stdout\n                - multiline:\n                    type: pattern\n                    pattern:
    '^\\d+:\\w+\\s+\\d{2}\\s+\\w{3}\\s+\\d{4}'\n                    negate: true\n
    \                   match: after\n              prospector:\n                scanner:\n
    \                 fingerprint.enabled: true\n                  symlinks: true\n
    \             file_identity.fingerprint: ~\n        # Condition for json structured
    logs\n        - condition:\n            or:\n              # Business logs\n              -
    equals:\n                  kubernetes.container.name: \"tier1-gateway\"\n              -
    equals:\n                  kubernetes.container.name: \"tier2-gateway\"\n              #
    Onboarding technical logs containers\n              - equals:\n                  kubernetes.container.name:
    \"identity-provider\"\n              - equals:\n                  kubernetes.container.name:
    \"onboarding\"\n              - equals:\n                  kubernetes.container.name:
    \"security-attributes-provider\"\n              - equals:\n                  kubernetes.container.name:
    \"users-roles\"\n              - equals:\n                  kubernetes.container.name:
    \"edc-connector-adapter\"\n              # Logs not specified yet\n              -
    equals:\n                  kubernetes.container.name: \"signer\"\n              -
    equals:\n                  kubernetes.container.name: \"sd-creation-wizard-api\"\n
    \             - equals:\n                  kubernetes.container.name: \"sd-creation-wizard-api-validation\"\n
    \             - equals: \n                  kubernetes.container.name: \"xsfc-advsearch-be\"\n
    \             - equals:\n                  kubernetes.container.name: \"contract-consumption-be-api\"\n
    \             - equals:\n                  kubernetes.container.name: \"authentication-provider\"\n
    \             - equals:\n                  kubernetes.container.name: \"contract-consumer\"\n
    \             - equals:\n                  kubernetes.container.name: \"contract-dataprovider\"\n
    \         config:\n            - type: filestream\n              id: json-structured-logs-${data.kubernetes.container.id}\n
    \             paths:\n                - /var/log/containers/*${data.kubernetes.container.id}.log\n
    \             parsers:\n                - container:\n                    stream:
    all\n              prospector:\n                scanner:\n                  fingerprint.enabled:
    true\n                  fingerprint.length: 512\n                  fingerprint.offset:
    0\n                  symlinks: true\n              file_identity.fingerprint:
    ~\n        - condition:\n            or:\n              # External apps logs\n
    \             - equals:\n                  kubernetes.container.name: \"keycloak\"\n
    \             - equals:\n                  kubernetes.container.name: \"postgres\"\n
    \         config:\n            - type: filestream\n              id: external-apps-logs-${data.kubernetes.container.id}\n
    \             paths:\n                - /var/log/containers/*${data.kubernetes.container.id}.log\n
    \             parsers:\n                - container:\n                    stream:
    stdout\n                - multiline:\n                    type: pattern\n                    pattern:
    '^[0-9]{4}-[0-9]{2}-[0-9]{2}'\n                    negate: true\n                    match:
    after\n              prospector:\n                scanner:\n                  fingerprint.enabled:
    true\n                  symlinks: true\n              file_identity.fingerprint:
    ~\n        # EDC container logs\n        - condition.equals.kubernetes.container.name:
    \"simpl-edc-container\"\n          config:\n            - type: filestream\n              id:
    edc-logs-${data.kubernetes.container.id}\n              paths:\n                -
    /var/log/containers/*${data.kubernetes.container.id}.log\n              parsers:\n
    \               - container:\n                    stream: stdout\n                -
    multiline:\n                    type: pattern\n                    pattern: '^\\x1B\\[[0-9;]*[mK]*(DEBUG|INFO|WARNING|ERROR|SEVERE)'\n
    \                   negate: true\n                    match: after\n              prospector:\n
    \               scanner:\n                  fingerprint.enabled: true\n                  symlinks:
    true\n              file_identity.fingerprint: ~\n        - condition.equals.kubernetes.container.name:
    \"kafka\"\n          config:\n            - type: filestream\n              id:
    kafka-logs-${data.kubernetes.container.id}\n              paths:\n                -
    /var/log/containers/*${data.kubernetes.container.id}.log\n              parsers:\n
    \               - container:\n                    stream: stdout\n                -
    multiline:\n                    type: pattern\n                    pattern: '^\\[[A-Z]+\\]\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}'\n
    \                   negate: true\n                    match: after\n              prospector:\n
    \               scanner:\n                  fingerprint.enabled: true\n                  symlinks:
    true\n              file_identity.fingerprint: ~\n"
  output: "output.logstash:\n  hosts: [\"${LOGSTASH_HOSTS}\"]\n  ssl.enabled: true\n
    \ ssl.certificate_authorities: [\"/usr/share/filebeat/certs/ca.crt\"]\n  ssl.verification_mode:
    full\n  ssl.certificate: \"/usr/share/filebeat/certs/tls.crt\"\n  ssl.key: \"/usr/share/filebeat/certs/tls.key\"\n#output.console:\n#
    \ pretty: true  \n"
