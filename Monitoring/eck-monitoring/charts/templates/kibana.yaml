{{- if eq .Values.namespaceTag .Values.mainNamespace }}
{{- if gt (.Values.kibana.count |int) 0}}
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: {{ .Release.Name }}-kibana
spec:
  version: {{ .Values.elasticVersion }}
  {{- if eq .Values.deploy_minimal_stack true }}
  count: {{ .Values.kibana.minimal_stack_count }}
  {{- else }}
  count: {{ .Values.kibana.count }}
  {{- end }}
  image: {{ .Values.kibana.image }}:{{ default .Values.elasticVersion   .Values.kibana.imageTag }}
  monitoring:
    logs:
      elasticsearchRefs:
        - name: {{ .Release.Name }}-elasticsearch
    metrics:
      elasticsearchRefs:
        - name: {{ .Release.Name }}-elasticsearch  
  config:
    server.ssl.enabled: true
    elasticsearch.requestTimeout: 120000
    server.publicBaseUrl: "{{ template "kibana.dns.fullPath" . }}"
    xpack.reporting.enabled: true
    xpack.reporting.kibanaServer.protocol: "https"
    {{- with .Values.kibana.config }}
    {{- toYaml .| nindent 4 }}
    {{- end }}
    xpack.fleet.packages:
      - name: apm
        version: latest
    xpack.fleet.agentPolicies:
      - name: apm-1
        id: "1"
        package_policies:
          - package:
              name: apm
            name: System Integration  
  elasticsearchRef:
    name: {{ default .Values.kibana.elasticsearchReleaseName .Release.Name }}-elasticsearch
  podTemplate:
    metadata:
      labels:
        stack-namespace: {{.Release.Namespace}} 
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 4 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: git-clone
          image: ghcr.io/cnie-es/alpine-git:2.52.0
          args:
            - clone
            - --single-branch
            - --branch
            - {{ .Values.kibana.dashboardsBranch }}
            - https://code.europa.eu/simpl/simpl-open/development/monitoring/eck-monitoring.git
            - /mnt/dashboards
          volumeMounts:
            - name: repo
              mountPath: /mnt/dashboards
      containers:
      - name: kibana
        imagePullPolicy: Always
        {{- if eq .Values.deploy_minimal_stack true }}
        {{- with .Values.kibana.minimal_stack_resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- else }}
        {{- with .Values.kibana.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- end }}
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: "/"
            port: 5601
      - name: filebeat
        {{- with .Values.kibana.resources_filebeat }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      - name: metricbeat
        {{- with .Values.kibana.resources_metricbeat }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}            
        env:
          - name: ELASTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-elasticsearch-es-elastic-user 
                key: elastic  
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "cd /mnt/dashboards/charts/kibana/dashboards/; chmod +x ./load_dashboards.sh; ./load_dashboards.sh > /mnt/dashboards/load_dashboard.log"]
        volumeMounts:
          - name: repo
            mountPath: /mnt/dashboards
      volumes:
        - name: repo
          emptyDir: {}
  http:
    tls:
      certificate:
        secretName: {{ .Release.Name }}-kibana-ssl
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-kibana-dashboard
  annotations:
    k8s.apisix.apache.org/upstream-scheme: "https"
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: apisix
  tls:
  - hosts:
      - {{ template "kibana.dns" . }}
    secretName: {{ .Release.Name }}-kibana-ssl
  rules:
    - host: {{ template "kibana.dns" . }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend: 
              service:
                name:  {{ .Release.Name }}-kibana-kb-http
                port:
                  number: 5601
---
apiVersion: v1
kind: Secret # gitleaks:allow -- contains only a public CA certificate
metadata:
  name: lets-encrypt-ca
data:
  ca.crt: ""
---
{{- end }}
{{- end }}
