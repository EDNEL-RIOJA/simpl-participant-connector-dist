{{- if eq .Values.namespaceTag .Values.mainNamespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: objects-loader
  labels:
    app: objects-loader
  annotations:
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: load-objects-script
          configMap:
            name: load-objects-script
            defaultMode: 0755
        - name: ilm-temp
          emptyDir: {}
        - name: apm-ilms
          configMap:
            name: apm-ilms-configmap
        - name: metricbeat-ilm-vol
          configMap:
            name: metricbeat-ilm-configmap
        - name: filebeat-ilm-vol
          configMap:
            name: filebeat-ilm-configmap
        - name: heartbeat-ilm-vol
          configMap:
            name: heartbeat-ilm-configmap
        - name: logstash-monitoring-ilm-vol
          configMap:
            name: logstash-monitoring-ilm-configmap
        - name: logstash-beats-ilms-vol
          configMap:
            name: logstash-beats-ilms-configmap
        - name: templates-vol
          configMap:
            name: templates-configmap
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: objects-loader
          image: alpine/git:latest
          command: ["/bin/sh", "-c", "apk add --no-cache curl gawk coreutils bash && /bin/bash /scripts/load_objects.sh 2>&1"]
          env:
            - name: RELEASE_NAME
              value: {{ .Release.Name }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-elasticsearch-es-elastic-user
                  key: elastic
            - name: STACK_VERSION
              value: {{ .Values.elasticVersion }}
          volumeMounts:
            - name: load-objects-script
              mountPath: /scripts
            - name: ilm-temp
              mountPath: /mnt/ilm
            - name: apm-ilms
              mountPath: /usr/share/apm-server/ilm
            - name: metricbeat-ilm-vol
              mountPath: /usr/share/metricbeat/ilm
            - name: filebeat-ilm-vol
              mountPath: /usr/share/filebeat/ilm/filebeat-ilm.json
              subPath: filebeat-ilm.json
            - name: heartbeat-ilm-vol
              mountPath: /usr/share/heartbeat/ilm/heartbeat-ilm.json
              subPath: heartbeat-ilm.json
            - name: logstash-monitoring-ilm-vol
              mountPath: /usr/share/logstash-mon/ilm/logstash-monitoring-ilm.json
              subPath: logstash-monitoring-ilm.json
            - name: logstash-beats-ilms-vol
              mountPath: /usr/share/logstash-beats/ilm
            - name: templates-vol
              mountPath: /mnt/templates
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: load-objects-script
data:
  load_objects.sh: |
{{ .Files.Get "kibana/scripts/load_objects.sh" | indent 4 }}
