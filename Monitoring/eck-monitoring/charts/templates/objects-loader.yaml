apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-ilms-configmap
data: 
  metrics-apm.app_metrics-default_policy.json: |
    {
      "policy": {
        "phases": {
        {{- if eq .Values.deploy_minimal_stack true }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.apmServer.minimal_stack_ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.apmServer.minimal_stack_ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age": "{{ .Values.apmServer.minimal_stack_ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
        }
        {{- else }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.apmServer.ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.apmServer.ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age": "{{ .Values.apmServer.ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
        }
        {{- end }}
        
      }
    }
  traces-apm.traces-default_policy.json: |
    {
      "policy": {
        "phases": {
        {{- if eq .Values.deploy_minimal_stack true }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.apmServer.minimal_stack_ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.apmServer.minimal_stack_ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age": "{{ .Values.apmServer.minimal_stack_ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
        }
        {{- else }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.apmServer.ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.apmServer.ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age": "{{ .Values.apmServer.ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
          }
        {{- end }}
        
      }
    }
