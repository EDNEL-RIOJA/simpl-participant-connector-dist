{{- if eq .Values.namespaceTag .Values.mainNamespace }}
apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-server
  labels:
    app: apm-server
  annotations:
    helm.sh/hook-weight: "10"
spec:
  version: {{ .Values.elasticVersion }}
  image: {{ .Values.apmServer.image }}:{{ default .Values.elasticVersion   .Values.apmServer.imageTag }}
  {{- if eq .Values.deploy_minimal_stack true }}
  count: {{ .Values.apmServer.minimal_stack_count }}
  {{- else }}
  count: {{ .Values.apmServer.count }}
  {{- end }}
  elasticsearchRef:
    name: {{ .Release.Name }}-elasticsearch
  kibanaRef:
    name: {{ .Release.Name }}-kibana
  podTemplate:
    metadata:
      labels:
        stack-namespace: {{ .Release.Namespace }} 
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apm-server
          workingDir: /usr/share/apm-server
          imagePullPolicy: Always
          {{- if eq .Values.deploy_minimal_stack true }}
          {{- with .Values.apmServer.minimal_stack_resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else }}
          {{- with .Values.apmServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-apm-server
  annotations:
    k8s.apisix.apache.org/upstream-scheme: "https"
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: apisix
  tls:
  - hosts:
      - {{ template "apmServer.dns" . }}
    secretName: {{ .Release.Name }}-apm-ssl
  rules:
    - host: {{ template "apmServer.dns" . }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend: 
              service:
                name: apm-server-apm-http
                port:
                  number: 8200
{{- end }}
