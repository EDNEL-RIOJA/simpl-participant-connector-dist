---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-{{ .Values.cluster.namespace }}-svc-account
  namespace: {{ .Values.cluster.namespace }}
  labels:
    app.kubernetes.io/name: openbao-svc-account
    app.kubernetes.io/part-of: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-{{ .Values.cluster.namespace }}-role
  namespace: {{ .Values.cluster.namespace }}
  labels:
    app.kubernetes.io/name: openbao-svc-account
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "watch", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
  # Needed by the new 7b-rollout-kafka-on-change container to restart the
  # kafka brokers when their SASL users list changes.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-{{ .Values.cluster.namespace }}-rb
  namespace: {{ .Values.cluster.namespace }}
  labels:
    app.kubernetes.io/name: openbao-svc-account
subjects:
  - kind: ServiceAccount
    name: openbao-{{ .Values.cluster.namespace }}-svc-account
    namespace: {{ .Values.cluster.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-{{ .Values.cluster.namespace }}-role
{{- $allAgents := concat (.Values.agentList.authorities | default list) (.Values.agentList.providers | default list) (.Values.agentList.consumers | default list) }}
{{- range $allAgents }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-{{ $.Values.cluster.namespace }}-role
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: openbao-svc-account
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-{{ $.Values.cluster.namespace }}-rb
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: openbao-svc-account
subjects:
  - kind: ServiceAccount
    name: openbao-{{ $.Values.cluster.namespace }}-svc-account
    namespace: {{ $.Values.cluster.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-{{ $.Values.cluster.namespace }}-role
{{- end }}
