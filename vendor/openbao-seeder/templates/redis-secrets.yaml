{{- $existing := lookup "v1" "Secret" .Values.namespace "redis-secrets" -}}
{{- $yaDesplegado := lookup "apps/v1" "StatefulSet" .Values.namespace "redis-master" -}}
{{- /*
Guarda contra la rotacion silenciosa. El `lookup` de arriba es lo UNICO que conserva la password
entre renders, pero devuelve vacio si el render no tiene acceso al cluster. Sin esta guarda, ese
caso genera una password NUEVA sin avisar: se aplica, y a partir de ahi cada pod que se reinicie
coge un valor distinto al de los demas -> "WRONGPASS" en bucle con todos los pods en Running.

Si ya hay un redis-master desplegado, el Secret TIENE que existir: si el lookup vino vacio es que
falla el lookup, no que sea una instalacion nueva. Mejor romper el render, que se ve al instante en
ArgoCD, que rotar la password y romper el namespace de una forma que cuesta horas de diagnosticar.

LIMITE CONOCIDO: si el lookup falla del TODO, tampoco encuentra el StatefulSet y esta guarda no
salta -- se comporta como hoy. Cubre el caso de un lookup que resuelve a medias, no el de un
repo-server sin acceso al cluster. La red de seguridad para ese caso es el `checksum/redis-secret`
del deployer: si la password rota, Redis y sus clientes se reinician A LA VEZ y siguen cuadrando.
*/ -}}
{{- if and $yaDesplegado (not $existing) -}}
{{- fail (printf "redis-secrets no existe en %s pero redis-master SI: el lookup no esta resolviendo. NO se genera una password nueva (rotarla deja a los clientes con la vieja: WRONGPASS). Revisa el acceso al cluster del repo-server de ArgoCD antes de reintentar." .Values.namespace) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # La password NO debe regenerarse nunca despues de la primera creacion.
    #
    # Redis y sus clientes (authentication-provider, tier2-gateway) leen esta MISMA clave, pero cada
    # uno la resuelve UNA SOLA VEZ, al crear su pod: una env desde un Secret no se refresca. Ademas
    # el chart de Redis lleva `checksum/secret` en la plantilla del pod, asi que un cambio aqui
    # RECREA redis-master -> adopta la password nueva y deja fuera a los clientes, que siguen con la
    # vieja. Resultado: WRONGPASS en bucle, con todos los pods en Running y sin reinicios.
    # Ocurrio el 13/08: sync a las 10:45:09 -> redis-master recreado a las 10:45:35 -> el
    # authentication-provider (arrancado el 08/08) dejo de autenticar.
    #
    # El `lookup` de abajo es la unica pieza que conserva el valor vivo entre renders; NO quitarlo.
    # Estas dos anotaciones son el cinturon de seguridad: impiden que ArgoCD/Helm borren el Secret y
    # evitan el ruido de OutOfSync si algun dia el lookup no devuelve nada.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
data:
  redis: {{ if and $existing (index $existing.data "redis") }}{{ index $existing.data "redis" }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  commander: {{ if and $existing (index $existing.data "commander") }}{{ index $existing.data "commander" }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
