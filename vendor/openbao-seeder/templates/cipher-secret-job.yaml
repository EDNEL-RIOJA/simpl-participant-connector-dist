apiVersion: batch/v1
kind: Job
metadata:
  name: auth-provider-cipher-secret
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        security.banzaicloud.io/mutate: "skip"
        security.bank-vaults.io/mutate: "skip"
    spec:
      serviceAccountName: openbao-seeder-sa
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
      - name: create-cipher-secret
        image: {{ .Values.kubectl.image }}
        command: [sh, -c]
        args:
          - |
            if ! kubectl get secret authenticationprovider-db-cipher-secret \
                -n {{ .Values.namespace }} > /dev/null 2>&1; then
              echo "Creating authenticationprovider-db-cipher-secret..."
              kubectl create secret generic authenticationprovider-db-cipher-secret \
                -n {{ .Values.namespace }} \
                --from-literal=aes-key="$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64)"
              echo "Cipher secret created."
            else
              echo "Cipher secret already exists, skipping."
            fi
