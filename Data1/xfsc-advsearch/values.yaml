# Service port
servicePort: 8080

# Container port
containerPort: 8080

resources:
  requests:
    cpu: "0m"
    memory: "0Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"


ingress:
  # enable ingress only for development purpose
  # on production environment this service must be exposted through the participant tier1 gateway only
  enabled: false
  clusterIssuer: dev-prod
  # tls.secretName vacio = Let's Encrypt per-host (default); con valor = usa ese
  # Secret/SealedSecret TLS (p.ej. "vallelengua-tls") y NO emite con LE. Ver tier1-gateway.
  tls:
    secretName: ""
  ingressClass: apisix

#specify 'dev' for dev environment or 'dev-int' for integration environment
vaultEnvIdentifier: dev

#Domain associated with Dev Cluster (don't modify it)
domain: dev.simpl-europe.eu

log4j:
  # location for the log4j configuration file as defined in log4j-configmap.yaml and deployment.yaml
  config: file:/config/log4j2.xml
  # config file monitoring interval for hot changes (seconds)
  monitorInterval: 10
  level:
    # logging level for all logs excluding the specific ones
    root: INFO
    # logging level for application components only
    app: INFO
    # logging level for feign clients only
    feign: INFO

# comma separated list of servers url to be used by swagger
openapiConfig:
  servers: https://xfsc-advsearch-be.dev.simpl-europe.eu

openTelemetry:
  # disables the OpenTelemetry SDK (true on local dev)
  disabled: true
  # used to identify the environment
  environment: local-dev
  otlpExporter:
    # collector endpoint for the OTLP exporter
    endpoint: http://collector.common01.dev.simpl-europe.eu
    # protocol used by the OTLP exporter (http/protobuf or grpc)
    protocol: http/protobuf
  # context propagation type
  propagators: tracecontext

#ID of persistentVolumeClaims associated with NFS Storage
schemaVolumeClaim: nfs-storage-pvc
#Mount path used for schema storage
schemaPvcMountPath: /home/simpluser/data

# url to the AuthenticationProvider internal service
authenticationProvider:
  service:
    url: http://authentication-provider.gaiax-edc-dev-sd.svc.cluster.local:8080

# catalog adapter application (catalogue-adapter-service)
catalogueAdapter:
  tier2Gateway:
    # URI to the tier2 tls gateway of the catalog adapter application
    url: https://t2.gaiax-edc-dev-catalogue.dev.simpl-europe.eu
    # tier2 tls gateway path configured as route rule to the catalog adapter application
    pathPrefix: /catalogue-adapter-service


# federated catalog application
federatedCatalogue:
  tier2Gateway:
    # url to the tier2 tls gateway of the catalog adapter application
    url: https://t2.gaiax-edc-dev-catalogue.dev.simpl-europe.eu
    # tier2 tls gateway path configured as route rule to the federated catalog application
    pathPrefix: /fc-service

image:
  repository: "ghcr.io/cnie-es/data1-xfsc-advsearch-be"
  pullPolicy: Always
  tag: "1.18.0"

web:
  mvc:
    cors:
      # optional allowed origins for cross calls (separated by comma or * to allow all origins)
      # if empty no cross calls are allowed
      allowedOrigins: ""
    bearerToken:
      # if true a JWT token must be present as Bearer in any request
      required: true
      # optional list (comma separated) of allowed paths (ant matcher expressions) to skip JWT token check (ex: actuator health paths)
      allowedPaths: "/actuator/health/*,/status"
imagePullSecrets:
  - name: github-registry-secret

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
    httpHeaders:
      - name: Accept
        value: application/json
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
    httpHeaders:
      - name: Accept
        value: application/json
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
