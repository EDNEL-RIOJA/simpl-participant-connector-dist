apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # fixing fortify issue 'Kubernetes Misconfiguration: Service Account Token Automounted'
      automountServiceAccountToken: false
      
      # fixing fortify issue 'Kubernetes Misconfiguration: Improper Deployment Access Control'
      securityContext:
        seccompProfile:
          type: RuntimeDefault
          
      serviceAccountName: {{ if .Values.serviceAccount }}{{ .Values.serviceAccount.name | default .Release.Name }}{{ else }}{{ .Release.Name }}{{ end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: {{ .Release.Name }}-configmap
          configMap:
            name: {{ .Release.Name }}-configmap
        
        # alternative method to mount the serviceAccountToken when automountServiceAccountToken=false 
        - name: custom-token
          projected:
            defaultMode: 420
            sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 600
                audience: openbao
            - configMap:
                name: kube-root-ca.crt
                items:
                - key: ca.crt
                  path: ca.crt
            - downwardAPI:
                items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace    

      containers:
        - name: {{ .Chart.Name }}-api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.containerPort }}

          volumeMounts:
            - name: {{ .Release.Name }}-configmap
              mountPath: /config
            - name: custom-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount  

          env:
            - name: CONNECTOR_ADAPTER_SERVICE_URL
              value: {{ .Values.connectorAdapter.service.url | quote }}

            - name: LOGGING_CONFIG
              value: {{ .Values.log4j.config | quote }}

            - name: OPENAPI_CONFIG_SERVERS
              value: {{ .Values.openapiConfig.servers | quote }}

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.openTelemetry.otlpExporter.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.openTelemetry.otlpExporter.protocol | quote }}
            - name: OTEL_PROPAGATORS
              value: {{ .Values.openTelemetry.propagators | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.openTelemetry.environment | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ .Values.openTelemetry.disabled | quote }}

            - name: VALIDATION_CONFIG_ENABLED
              value: {{ .Values.validation.config.enabled | quote }}
            - name: VALIDATION_CONFIG_DOMAIN
              value: {{ .Values.validation.config.domain | quote }}
            - name: VALIDATION_CONFIG_VALIDATION_RESOURCE_ADDRESS_API_V1
              value: {{ .Values.validation.config.validationResourceAddressApiV1 | quote }}

            - name: WEB_MVC_CORS_ALLOWED_ORIGINS
              value: {{ .Values.web.mvc.cors.allowedOrigins | quote }}
            - name: WEB_MVC_BEARER_TOKEN_REQUIRED
              value: {{ .Values.web.mvc.bearerToken.required | quote }}
            - name: WEB_MVC_BEARER_TOKEN_ALLOWED_PATHS
              value: {{ .Values.web.mvc.bearerToken.allowedPaths | quote }}


          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.containerPort }}
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.containerPort }}
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
