replicaCount: 1

image:
  repository: "ghcr.io/cnie-es/data1-simpl-files"
  pullPolicy: IfNotPresent
  tag: "1.2.1"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "200m"
    memory: "128Mi"

ingress:
  hostname: files.dev.simpl-europe.eu
  secretName: simpl-tls-files
  clusterIssuer: dev-prod
  # tls.secretName vacio = Let's Encrypt per-host (default, usa 'secretName'+clusterIssuer);
  # con valor = usa ese Secret/SealedSecret TLS (p.ej. "vallelengua-tls") y NO emite con LE.
  tls:
    secretName: ""
  ingressClass: apisix
imagePullSecrets:
  - name: github-registry-secret
