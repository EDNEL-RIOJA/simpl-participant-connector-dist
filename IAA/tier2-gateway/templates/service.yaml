apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    {{- if eq .Values.service.type "LoadBalancer" }}
    # tier2 (mTLS a2a) va por LoadBalancer directo, no por APISIX, asi que necesita IP propia.
    # COMO se pide esa IP depende de quien gestione los LoadBalancer del cluster:
    #
    # lbNetwork=public   (default) c1/on-prem: IP publica anunciada por BGP con Cilium. Es lo de
    #                    produccion y el comportamiento historico del chart.
    # lbNetwork=internal c1/on-prem: IP de la vlan123 anunciada por L2 con Cilium. Entornos
    #                    internos (.example.invalid), que no tienen pool publico.
    # lbNetwork=cloud    CUALQUIER cluster gestionado (EKS, AKS, GKE) o cualquiera que no use
    #                    Cilium: NO se pone label ni loadBalancerClass y lo resuelve el
    #                    controlador del proveedor. Es el caso de un participante EXTERNO.
    #
    # Las clases io.cilium/* solo existen si Cilium gestiona los LoadBalancer. En un cluster
    # donde no las haya, el Service se queda <pending> PARA SIEMPRE y sin ruido: no hay evento
    # de error, simplemente nadie lo atiende. Sin IP no hay endpoint mTLS, asi que la authority
    # no puede alcanzar al participante y las negociaciones no arrancan.
    {{- if eq (.Values.lbNetwork | default "public") "internal" }}
    cnie.io/net-123: "true"
    {{- else if ne (.Values.lbNetwork | default "public") "cloud" }}
    cnie.io/public-lb: "true"
    {{- end }}
    {{- end }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ tpl .Values.hostT2 . | quote }}
    external-dns.alpha.kubernetes.io/ttl: "120"
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- if ne (.Values.lbNetwork | default "public") "cloud" }}
  loadBalancerClass: {{ if eq (.Values.lbNetwork | default "public") "internal" }}io.cilium/l2-announcer{{ else }}io.cilium/bgp-control-plane{{ end }}
  {{- end }}
  # Se lee de values para poder fijarlo por entorno desde app-values/tier2-gateway/values.yaml.
  # El default `Local` mantiene el comportamiento historico del chart; c1/on-prem lo pone a
  # `Cluster` porque con `Local` kube-proxy solo atiende la IP publica en los nodos que tienen un
  # backend local y DESCARTA el paquete en el resto (aqui el backend es un Deployment de 1 replica).
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | default "Local" }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "microservices.selectorLabels" . | nindent 4 }}
