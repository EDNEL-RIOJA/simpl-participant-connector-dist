{{/*
CA privada en el truststore del JVM.

Este servicio pide la identidad de la authority al arrancar
(CLIENT_AUTHORITY_AUTH_PROVIDER_URL, un host publico del espacio de datos). Con CA privada
el JVM no la trae de fabrica, el contexto de Spring no levanta y el pod entra en
CrashLoopBackOff con un mensaje que no menciona certificados:

  IllegalStateException: Authority identity retrieval failed

Se COPIA el cacerts y se le anade la CA; no se sustituye, asi que no se pierden las CAs
publicas y con certificado publico basta dejar caTrust.enabled=false (el default).
*/}}
apiVersion: apps/v1
kind: {{ if .Values.useDeamonSet }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microservices.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env-config: {{ include (print $.Template.BasePath "/env-configmap.yaml") . | sha256sum }}
        checksum/spring-config: {{ include (print $.Template.BasePath "/spring-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "microservices.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Chart.Name }}-svc-account
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.caTrust.enabled }}
        - name: build-truststore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SRC=$(find / -name cacerts -path '*/security/*' 2>/dev/null | head -1)
              cp "$SRC" /out/truststore.jks
              chmod 644 /out/truststore.jks
              keytool -importcert -noprompt -alias {{ .Values.caTrust.alias }} \
                -file /ca/{{ .Values.caTrust.caKey }} \
                -keystore /out/truststore.jks -storepass {{ .Values.caTrust.storePass }}
          volumeMounts:
            - name: ca-source
              mountPath: /ca
              readOnly: true
            - name: ca-trust
              mountPath: /out
        {{- end }}
        - name: check-authentication-provider
          image: "ghcr.io/cnie-es/curlimages-curl:8.18.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CHECK_CREDENTIAL_PRESENCE
              value: "{{ ternary "true" "false" .Values.initContainers.checkAuthProvider.checkCredentialPresence.enabled }}"
            - name: AUTH_PROVIDER_URL
              value: "{{ tpl .Values.microservices.authenticationProviderUrl . }}/actuator/health"
            - name: CREDENTIAL_CHECK_URL
              value: "{{ tpl .Values.microservices.authenticationProviderUrl . }}/tier1/v2/credentials/active"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Checking if authentication-provider is up at $AUTH_PROVIDER_URL ..."

              until curl -f "$AUTH_PROVIDER_URL" | grep '"status":"UP"'; do
                echo "authentication-provider not ready yet. Retrying in 5s..."
                sleep 5
              done

              echo "authentication-provider is up."

              if [ "$CHECK_CREDENTIAL_PRESENCE" = "true" ]; then
                echo "Checking credential presence..."
                until (
                  http_response_code="$(curl -qs $CREDENTIAL_CHECK_URL -o /dev/null -w "%{response_code}")"
                  echo "Check response code: $http_response_code"
                  [[ "$http_response_code" == "200" ]]
                  ); do
                  echo "Waiting credential installation"
                  echo "Retry credentials installation check..."
                  sleep 10
                done
                echo "Credential is installed."
              else
                echo "Credential presence check disabled."
              fi
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          {{- if or .Values.caTrust.enabled .Values.env }}
          env:
            {{- if .Values.caTrust.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/ca-trust/truststore.jks -Djavax.net.ssl.trustStorePassword={{ .Values.caTrust.storePass }}"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.caTrust.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.caTrust.enabled }}
            - name: ca-trust
              mountPath: /ca-trust
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.caTrust.enabled .Values.volumes }}
      volumes:
        {{- if .Values.caTrust.enabled }}
        - name: ca-source
          secret:
            secretName: {{ .Values.caTrust.secretName }}
            items:
              - key: {{ .Values.caTrust.caKey }}
                path: {{ .Values.caTrust.caKey }}
        - name: ca-trust
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
