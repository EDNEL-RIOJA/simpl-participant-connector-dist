---
server-port: 443
management-port: 8080
replicaCount: 1
image:
  repository: ghcr.io/cnie-es/iaa-tier2-gateway
  pullPolicy: Always
  tag: 2.10.0
imagePullSecrets:
- name: github-registry-secret
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
service:
  type: LoadBalancer
  port: 443
managementService:
  enabled: false
  type: ClusterIP
  port: 8080
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi
livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 10
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
volumes:
- name: spring-config
  configMap:
    name: tier2-gateway-spring-configmap
volumeMounts:
- name: spring-config
  mountPath: "/config/"
envFrom:
- configMapRef:
    name: tier2-gateway-env-configmap
nodeSelector: {}
tolerations: []
affinity: {}
appConfig: {}
kafkaConfig: {}
profile: ''
extraConfigImport: "/config/kafka.yml,classpath:config/routes-{{ .Values.profile }}.yml"
microservices:
  usersRolesUrl: http://users-roles.{{ .Release.Namespace }}.svc.cluster.local:8080
  securityAttributesProviderUrl: http://security-attributes-provider.{{ .Release.Namespace
    }}.svc.cluster.local:8080
  identityProviderUrl: http://identity-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
  authenticationProviderUrl: http://authentication-provider.{{ .Release.Namespace
    }}.svc.cluster.local:8080
redis:
  host: redis-master.{{ .Release.Namespace }}.svc.cluster.local
  port: '6379'
  username: default
  password: ''
hostT2: your-t2-host
authorityUrlT1: authority-t1-url
authorityAuthProviderUrl: "{{ .Values.authorityUrlT1 }}/authApi"
keypair:
  algorithm: EC
devMode: false
initContainers:
  checkAuthProvider:
    checkCredentialPresence:
      enabled: true
lbNetwork: public
caTrust:
  enabled: false
  secretName: private-ca-tls
  caKey: ca.crt
  alias: private-ca-ca
  storePass: changeit
