---
replicaCount: 1
image:
  repository: ghcr.io/cnie-es/users-roles
  pullPolicy: Always
  tag: 2.11.1
imagePullSecrets:
- name: github-registry-secret
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
service:
  type: ClusterIP
  port: 8080
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi
livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
volumes:
- name: spring-config
  configMap:
    name: users-roles-spring-configmap
- name: role-attributes
  configMap:
    name: users-roles-role-attributes
volumeMounts:
- name: spring-config
  mountPath: "/config/"
- name: role-attributes
  mountPath: "/app/config/roleAttributes.json"
  subPath: roleAttributes.json
envFrom:
- configMapRef:
    name: users-roles-configmap
nodeSelector: {}
tolerations: []
affinity: {}
hostT1: ''
authorityHostT2: ''
db:
  url: jdbc:postgresql://postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/usersroles
  username: usersroles
  password: ''
keycloak:
  master:
    user: user
    password: ''
    realm: ''
waitForKeycloak:
  enabled: true
  path: "/realms/master"
  curlTag: 8.18.0
kafkaConfig: {}
extraConfigImport: "/config/kafka.yml"
microservices:
  authenticationProviderUrl: http://authentication-provider.{{ .Release.Namespace
    }}.svc.cluster.local:8080
devMode: false
appConfig: {}
