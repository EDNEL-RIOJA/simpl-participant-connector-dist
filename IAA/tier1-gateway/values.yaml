appConfig: {}

profile: "authority" # authority or participant

cors:
  allowedHeaders: >
    Access-Control-Allow-Headers,
    Access-Control-Allow-Credentials,
    Access-Control-Allow-Origin,
    Access-Control-Allow-Methods,
    Keep-Alive,
    User-Agent,
    Content-Type,
    Authorization,
    Tenant,
    Channel,
    Platform,
    Set-Cookie,
    geolocation,
    x-mobility-mode,
    device,
    Cache-Control,
    X-Request-With,
    Accept,
    Origin
  allowOrigin: "" #cors origin separated by comma

hostT1: "" #your t1 host

ingress:
  issuer: "" #the issuer of the ingress certificate
  # TLS — dos modos (opt-in):
  #  - tls.secretName VACIO  -> Let's Encrypt per-host (cert-manager emite el cert
  #    del host via 'issuer'). Es el comportamiento por defecto.
  #  - tls.secretName CON VALOR -> usa ESE Secret/SealedSecret TLS ya presente en el
  #    namespace (p.ej. el wildcard "vallelengua-tls") y NO emite con Let's Encrypt
  #    (suprime la anotacion cert-manager) -> evita el rate-limit de LE.
  tls:
    secretName: ""

devMode: false

# CA privada en el truststore del JVM. Ver la nota al principio de templates/deployment.yaml.
# enabled=false por defecto: con certificados de CA publica no hace falta y el render no cambia.
caTrust:
  enabled: false
  # Secret del namespace con la CA. En c1 lo emite cert-manager (wildcard del entorno).
  secretName: private-ca-tls
  caKey: ca.crt
  alias: private-ca-ca
  # Solo protege un truststore de CAs publicas dentro del pod; no es un secreto.
  storePass: changeit
