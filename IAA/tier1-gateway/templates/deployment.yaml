{{/*
CA privada en el truststore del JVM.

Estos servicios llaman por HTTPS a los hosts publicos del propio espacio de datos
(participant-be-*, authority-be-*, /ca/OnBoardingCA). Si esos certificados los firma una
CA privada -- cualquier entorno .example.invalid -- el JVM no la trae de fabrica y la llamada
muere con "PKIX path building failed", que se ve como un 500 opaco:

  POST /tier1/v2/keypairs        -> 500, el onboarding no genera el par de claves
  POST /tier1/v2/credentials     -> 500 "CA certificate not found"

Se COPIA el cacerts del JVM y se le anade la CA; no se sustituye, asi que no se pierden las
CAs publicas y el mismo chart sirve para un entorno con certificado publico dejando
caTrust.enabled=false (el default).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microservices.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env-config: {{ include (print $.Template.BasePath "/env-configmap.yaml") . | sha256sum }}
        checksum/spring-config: {{ include (print $.Template.BasePath "/spring-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "microservices.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Chart.Name }}-svc-account
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.caTrust.enabled }}
      initContainers:
        - name: build-truststore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SRC=$(find / -name cacerts -path '*/security/*' 2>/dev/null | head -1)
              cp "$SRC" /out/truststore.jks
              chmod 644 /out/truststore.jks
              keytool -importcert -noprompt -alias {{ .Values.caTrust.alias }} \
                -file /ca/{{ .Values.caTrust.caKey }} \
                -keystore /out/truststore.jks -storepass {{ .Values.caTrust.storePass }}
          volumeMounts:
            - name: ca-source
              mountPath: /ca
              readOnly: true
            - name: ca-trust
              mountPath: /out
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if or .Values.caTrust.enabled .Values.env }}
          env:
            {{- if .Values.caTrust.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/ca-trust/truststore.jks -Djavax.net.ssl.trustStorePassword={{ .Values.caTrust.storePass }}"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.caTrust.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.caTrust.enabled }}
            - name: ca-trust
              mountPath: /ca-trust
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.caTrust.enabled .Values.volumes }}
      volumes:
        {{- if .Values.caTrust.enabled }}
        - name: ca-source
          secret:
            secretName: {{ .Values.caTrust.secretName }}
            items:
              - key: {{ .Values.caTrust.caKey }}
                path: {{ .Values.caTrust.caKey }}
        - name: ca-trust
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
