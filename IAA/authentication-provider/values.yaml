---
replicaCount: 1
image:
  repository: ghcr.io/cnie-es/iaa-authentication_provider
  pullPolicy: Always
  tag: 2.9.0
imagePullSecrets:
- name: github-registry-secret
nameOverride: ''
fullnameOverride: ''
kubectl:
  image: ghcr.io/cnie-es/alpine-kubectl:1.35.2
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
service:
  type: ClusterIP
  port: 8080
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi
livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
volumes:
- name: spring-config
  configMap:
    name: authentication-provider-configmap
volumeMounts:
- name: spring-config
  mountPath: "/config/"
envFrom: {}
nodeSelector: {}
tolerations: []
affinity: {}
db:
  cipherSecret: authenticationprovider-db-cipher-secret
kafkaConfig: {}
vaultConfig: {}
appConfig:
  spring:
    profiles:
      active:
    config:
      import:
      - "/config/kafka.yml"
      - "/config/vault.yml"
    datasource:
      url: jdbc:postgresql://postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/authenticationprovider
      username: authenticationprovider
      password: ''
    data:
      redis:
        host: redis-master.{{ .Release.Namespace }}.svc.cluster.local
        port: 6379
        username: default
        password: ''
  security:
    secret:
      location: database
  simpl:
    certificate:
      san: "<your-t2-fqdn>"
  microservice:
    identity-provider:
      url: http://identity-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
    security-attributes-provider:
      url: http://security-attributes-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
  client:
    authority:
      url: ''
  keypair:
    signature-algorithm: SHA256withECDSA
    algorithm: ECDSA
    key-length: 256
    read-algorithm: EC
  management:
    tracing:
      sampling:
        probability:
        - MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    otlp:
      tracing:
        endpoint:
        - MANAGEMENT_OTLP_TRACING_ENDPOINT
caTrust:
  enabled: false
  secretName: private-ca-tls
  caKey: ca.crt
  alias: private-ca-ca
  storePass: changeit
