{{- if .Values.initAuthority.enabled  }}
apiVersion: batch/v1
kind: Job
metadata:
  name: init-authority-job-{{ randAlphaNum 6 | lower }}
spec:
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      containers:
        - name: init-authority
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/bash", "./scripts/init-authority-bash.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: init-authority-configmap
{{- end }}
