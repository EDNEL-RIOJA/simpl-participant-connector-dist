{{- if .Values.initParticipant.enabled  }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-participant-configmap
  namespace: {{ .Release.Namespace }}
data:

  PARTICIPANT_TYPE: {{ .Values.initParticipant.ptype | quote }}

  # When set, init-participant-bash.sh skips onboard-agent and reuses this
  # UUID for the subsequent upload-csr/download-pem calls.
  PRE_EXISTING_PARTICIPANT_ID: {{ .Values.initParticipant.preExistingParticipantId | default "" | quote }}

  CSR_CN: "{{ tpl .Values.initParticipant.csr.cn . }}"
  CSR_O: {{ tpl .Values.initParticipant.csr.o . | quote }}
  CSR_OU: {{ tpl .Values.initParticipant.csr.ou . | quote }}
  CSR_C: {{ .Values.initParticipant.csr.country | quote }}

  AGENT_URL: "https://{{ tpl .Values.initParticipant.hostT1 . }}"
  AUTHORITY_URL: "https://{{ .Values.initParticipant.authorityHostT1 }}"


  KEYCLOAK_INTERNAL_HOST: {{ tpl .Values.initParticipant.keycloak.internalHost . | quote }}
  KEYCLOAK_INTERNAL_PORT: {{ .Values.initParticipant.keycloak.internalPort | quote }}
  KEYCLOAK_URL: "{{ tpl .Values.initParticipant.keycloak.url . }}"
  KEYCLOAK_APP_REALM: {{ tpl .Values.initParticipant.keycloak.app.realm . | quote }}
  KEYCLOAK_APP_CLIENT_SECRET: {{ .Values.initParticipant.keycloak.app.clientSecret | quote }}
  KEYCLOAK_APP_CLIENT_ID: {{ .Values.initParticipant.keycloak.app.clientId | quote }}
  KEYCLOAK_MASTER_USER: {{  .Values.initParticipant.keycloak.master.user | quote }}
  KEYCLOAK_MASTER_PASSWORD: {{ .Values.initParticipant.keycloak.master.password | quote }}
  KEYCLOAK_AUTHORITY_MASTER_USER: {{  .Values.initParticipant.keycloak.authority.user | quote }}
  KEYCLOAK_AUTHORITY_MASTER_PASSWORD: {{ .Values.initParticipant.keycloak.authority.password | quote }}
  KEYCLOAK_AUTHORITY_REALM: {{ .Values.initParticipant.keycloak.authority.realm | quote }}

  MICROSERVICE_USERS_ROLES_URL: {{ tpl .Values.initParticipant.microservices.usersRolesUrl . | quote }}
  MICROSERVICE_AUTHENTICATION_PROVIDER_URL: {{ tpl .Values.initParticipant.microservices.authenticationProviderUrl . | quote }}

  MICROSERVICE_USERS_ROLES_INTERNAL_URL: "http://users-roles.{{ .Release.Namespace }}.svc.cluster.local:8080"
  MICROSERVICE_AUTHENTICATION_PROVIDER_INTERNAL_URL: "http://authentication-provider.{{ .Release.Namespace }}.svc.cluster.local:8080"
{{- end }}
