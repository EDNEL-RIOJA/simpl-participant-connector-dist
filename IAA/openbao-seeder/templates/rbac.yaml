apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-seeder-secret-manager
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-seeder-secret-manager-binding
  namespace: {{ .Values.namespace }}
subjects:
- kind: ServiceAccount
  name: openbao-seeder-sa
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: openbao-seeder-secret-manager
  apiGroup: rbac.authorization.k8s.io
