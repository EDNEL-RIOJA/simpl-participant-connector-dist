apiVersion: v1
kind: Secret
metadata:
  name: pg-admin-secret
data:
  password: {{ include "pgadmin.password" . | b64enc }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: redpanda-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  auth: {{ htpasswd "admin" (include "redpanda.password" .) | b64enc }}
  password: {{ include "redpanda.password" . | b64enc }}
---
{{- $existingKafkaSecret := lookup "v1" "Secret" .Release.Namespace "kafka-users-secret" -}}
apiVersion: v1
kind: Secret
metadata:
  name: kafka-users-secret
data:
  redpanda: {{ include "redpandakafkauser.password" . | b64enc }}
  notification: {{ include "notificationkafkauser.password" . | b64enc }}
  icms: {{ include "icmskafkauser.password" . | b64enc }}
  {{- range .Values.agentList.authorities }}
  "{{ . }}_authprovider": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_authprovider" .)) }}{{ index $existingKafkaSecret.data (printf "%s_authprovider" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_usersroles": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_usersroles" .)) }}{{ index $existingKafkaSecret.data (printf "%s_usersroles" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_onboarding": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_onboarding" .)) }}{{ index $existingKafkaSecret.data (printf "%s_onboarding" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_tier2gw": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_tier2gw" .)) }}{{ index $existingKafkaSecret.data (printf "%s_tier2gw" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  {{- end }}
  {{- range .Values.agentList.providers }}
  "{{ . }}_authprovider": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_authprovider" .)) }}{{ index $existingKafkaSecret.data (printf "%s_authprovider" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_usersroles": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_usersroles" .)) }}{{ index $existingKafkaSecret.data (printf "%s_usersroles" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_contract": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_contract" .)) }}{{ index $existingKafkaSecret.data (printf "%s_contract" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_infrabe": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_infrabe" .)) }}{{ index $existingKafkaSecret.data (printf "%s_infrabe" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_tier2gw": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_tier2gw" .)) }}{{ index $existingKafkaSecret.data (printf "%s_tier2gw" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  {{- end }}
  {{- range .Values.agentList.consumers }}
  "{{ . }}_authprovider": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_authprovider" .)) }}{{ index $existingKafkaSecret.data (printf "%s_authprovider" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_usersroles": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_usersroles" .)) }}{{ index $existingKafkaSecret.data (printf "%s_usersroles" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_contract": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_contract" .)) }}{{ index $existingKafkaSecret.data (printf "%s_contract" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_contract_consumption": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_contract_consumption" .)) }}{{ index $existingKafkaSecret.data (printf "%s_contract_consumption" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_tier2gw": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_tier2gw" .)) }}{{ index $existingKafkaSecret.data (printf "%s_tier2gw" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  "{{ . }}_edcconn": {{ if and $existingKafkaSecret (index $existingKafkaSecret.data (printf "%s_edcconn" .)) }}{{ index $existingKafkaSecret.data (printf "%s_edcconn" .) }}{{ else }}{{ randAlphaNum 16 | nospace | b64enc }}{{ end }}
  {{- end }}
type: Opaque
---
{{- $existingRedisSecret := lookup "v1" "Secret" .Release.Namespace "redis-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
data:
  redis: {{ if and $existingRedisSecret (index $existingRedisSecret.data "redis") }}{{ index $existingRedisSecret.data "redis" }}{{ else }}{{ include "redis.password" . | b64enc }}{{ end }}
  commander: {{ if and $existingRedisSecret (index $existingRedisSecret.data "commander") }}{{ index $existingRedisSecret.data "commander" }}{{ else }}{{ include "rediscommander.password" . | b64enc }}{{ end }}
type: Opaque
{{- range .Values.agentList.authorities }}
{{- $existingRedisSecretNs := lookup "v1" "Secret" . "redis-secrets" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: {{ . }}
data:
  redis: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "redis") }}{{ index $existingRedisSecretNs.data "redis" }}{{ else }}{{ include "redis.password" $ | b64enc }}{{ end }}
  commander: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "commander") }}{{ index $existingRedisSecretNs.data "commander" }}{{ else }}{{ include "rediscommander.password" $ | b64enc }}{{ end }}
type: Opaque
{{- end }}
{{- range .Values.agentList.providers }}
{{- $existingRedisSecretNs := lookup "v1" "Secret" . "redis-secrets" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: {{ . }}
data:
  redis: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "redis") }}{{ index $existingRedisSecretNs.data "redis" }}{{ else }}{{ include "redis.password" $ | b64enc }}{{ end }}
  commander: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "commander") }}{{ index $existingRedisSecretNs.data "commander" }}{{ else }}{{ include "rediscommander.password" $ | b64enc }}{{ end }}
type: Opaque
{{- end }}
{{- range .Values.agentList.consumers }}
{{- $existingRedisSecretNs := lookup "v1" "Secret" . "redis-secrets" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: {{ . }}
data:
  redis: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "redis") }}{{ index $existingRedisSecretNs.data "redis" }}{{ else }}{{ include "redis.password" $ | b64enc }}{{ end }}
  commander: {{ if and $existingRedisSecretNs (index $existingRedisSecretNs.data "commander") }}{{ index $existingRedisSecretNs.data "commander" }}{{ else }}{{ include "rediscommander.password" $ | b64enc }}{{ end }}
type: Opaque
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
data:
  {{- range .Values.agentList.authorities }}
  {{ . }}: {{ randAlphaNum 16 | nospace | b64enc }}
  {{- end }}
  {{- range .Values.agentList.providers }}
  {{ . }}: {{ randAlphaNum 16 | nospace | b64enc }}
  {{- end }}
  {{- range .Values.agentList.consumers }}
  {{ . }}: {{ randAlphaNum 16 | nospace | b64enc }}
  {{- end }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-secrets
data:
  gitops_test: {{ randAlphaNum 16 | nospace | b64enc }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: ejbca-secret
data:
  keystorepass: {{ randAlphaNum 16 | nospace | b64enc }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: schema-manager-secret
data:
  admin: {{ randAlphaNum 16 | nospace | b64enc }}
type: Opaque