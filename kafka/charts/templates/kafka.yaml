---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
spec:
  replicas: {{ .Values.kafka.replicas }}
  image:
    application: {{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.application }}:{{ .Values.kafka.image.tag }}
    init: {{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.initImage }}:{{ .Values.kafka.image.initTag }}
  dataVolumeCapacity: 10Gi
  {{- if .Values.kafka.storageClass.name }}
  storageClass:
    name: {{ .Values.kafka.storageClass.name }}
  {{- end }}
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  podTemplate:
    annotations:
      {{- if and .Values.kafka.auth.enabled (eq .Values.kafka.auth.secretMethod "vault") }}
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-image: "ghcr.io/cnie-es/openbao:2.4.3"
      vault.hashicorp.com/role: {{ .Values.hashicorp.role }}
      {{- if and (hasKey .Values "hashicorp") (hasKey .Values.hashicorp "service") }}
      vault.hashicorp.com/service: {{ .Values.hashicorp.service }}
      {{- end }}
      vault.hashicorp.com/agent-inject-secret-plain-jaas.conf: "{{ tpl .Values.hashicorp.secretConfigPath . }}"
      vault.hashicorp.com/agent-inject-template-plain-jaas.conf: |
        {{- $secretPath := tpl .Values.hashicorp.secretConfigPath . -}}
        {{- $template := printf (printf "{{`{{ with secret \"%s\" }}\n" $secretPath) -}}
        {{- $template = printf "%ssasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required" $template -}}
        {{- $template = printf "%s{{ range $k, $v := .Data.data }}" $template -}}
        {{- $template = printf "%s user_{{ $k }}=\"{{ $v }}\"" $template -}}
        {{- $template = printf "%s{{ end }};" $template -}}
        {{- $template = printf "%s{{ end }}`}}" $template -}}
        {{- tpl $template . | nindent 10 }}
      {{- end }}
    serviceAccountName: {{ .Values.kafka.serviceAccount.name }}
    resources: {{- toYaml .Values.kafka.resources | nindent 6 }}
  {{- if .Values.kafka.auth.enabled }}
  listeners:
    external:
      authentication:
        type: plain
        jaasConfigPassThrough:
          directoryPathInContainer: /vault/secrets
    # Custom advertised listeners
    custom:
      {{- if .Values.kafka.listeners.tls.enabled }}
      # TLS advertised listener on port 9094
      - name: tls
        port: 9094
        authentication:
          type: plain
          {{- if eq .Values.kafka.auth.secretMethod "kubernetes" }}
          jaasConfigPassThrough:
            secretRef: {{ .Values.kafka.auth.secretName }}
          {{- else }}
          jaasConfigPassThrough:
            directoryPathInContainer: /vault/secrets
          {{- end }}
        tls:
          enabled: true
          {{- if .Values.kafka.listeners.tls.certManager.enabled }}
          secretRef: kafka-tls-internal
          {{- else if .Values.kafka.listeners.tls.secretRef }}
          secretRef: {{ .Values.kafka.listeners.tls.secretRef }}
          {{- end }}
      {{- end }}
      {{- if .Values.kafka.listeners.perBroker.enabled }}
      # Per-broker plaintext listener
      - name: dev-plain
        port: {{ .Values.kafka.listeners.perBroker.plaintext.port | default 9096 }}
        authentication:
          type: plain
          {{- if eq .Values.kafka.auth.secretMethod "kubernetes" }}
          jaasConfigPassThrough:
            secretRef: {{ .Values.kafka.auth.secretName }}
          {{- else }}
          jaasConfigPassThrough:
            directoryPathInContainer: /vault/secrets
          {{- end }}
        externalAccess:
          {{- if eq (.Values.kafka.listeners.perBroker.routingType | default "host") "port" }}
          # Port-based routing: same host, different ports (host.docker.internal:9096, host.docker.internal:9097, host.docker.internal:9098)
          type: staticForPortBasedRouting
          staticForPortBasedRouting:
            host: {{ .Values.kafka.listeners.perBroker.host | default "host.docker.internal" }}
            portOffset: {{ .Values.kafka.listeners.perBroker.plaintext.portOffset | default 9096 }}
          {{- else }}
          # Host-based routing: different hosts, same port (kafka0.local:9096, kafka1.local:9096, kafka2.local:9096)
          type: staticForHostBasedRouting
          staticForHostBasedRouting:
            domain: {{ .Values.kafka.listeners.perBroker.domain | default "local" }}
            port: {{ .Values.kafka.listeners.perBroker.plaintext.port | default 9096 }}
            brokerPrefix: {{ .Values.kafka.listeners.perBroker.brokerPrefix | default "kafka" }}
          {{- end }}
      # Per-broker TLS listener
      - name: dev-tls
        port: {{ .Values.kafka.listeners.perBroker.tls.port | default 9099 }}
        authentication:
          type: plain
          {{- if eq .Values.kafka.auth.secretMethod "kubernetes" }}
          jaasConfigPassThrough:
            secretRef: {{ .Values.kafka.auth.secretName }}
          {{- else }}
          jaasConfigPassThrough:
            directoryPathInContainer: /vault/secrets
          {{- end }}
        tls:
          enabled: true
          {{- if .Values.kafka.listeners.perBroker.tls.secretRef }}
          secretRef: {{ .Values.kafka.listeners.perBroker.tls.secretRef }}
          {{- else if .Values.kafka.listeners.tls.certManager.enabled }}
          secretRef: kafka-tls-internal
          {{- end }}
        externalAccess:
          {{- if eq (.Values.kafka.listeners.perBroker.routingType | default "host") "port" }}
          # Port-based routing: same host, different ports (host.docker.internal:9099, host.docker.internal:9100, host.docker.internal:9101)
          type: staticForPortBasedRouting
          staticForPortBasedRouting:
            host: {{ .Values.kafka.listeners.perBroker.host | default "host.docker.internal" }}
            portOffset: {{ .Values.kafka.listeners.perBroker.tls.portOffset | default 9099 }}
          {{- else }}
          # Host-based routing: different hosts, same port (kafka0.local:9099, kafka1.local:9099, kafka2.local:9099)
          type: staticForHostBasedRouting
          staticForHostBasedRouting:
            domain: {{ .Values.kafka.listeners.perBroker.domain | default "local" }}
            port: {{ .Values.kafka.listeners.perBroker.tls.port | default 9099 }}
            brokerPrefix: {{ .Values.kafka.listeners.perBroker.brokerPrefix | default "kafka" }}
          {{- end }}
      {{- end }}
  {{- end }}
  configOverrides:
    jvm:
      - "-Xmx4g"
      - "-XX:+UseContainerSupport"
      - "-XX:MaxRAMPercentage=50.0"
    server:
      - default.replication.factor={{ .Values.kafka.topic.replicas }}
      - min.insync.replicas={{ .Values.kafka.topic.insyncreplicas }}
      - config.storage.replication.factor={{ .Values.kafka.topic.replicas }}
      - offset.storage.replication.factor={{ .Values.kafka.topic.replicas }}
      - offsets.topic.replication.factor={{ .Values.kafka.topic.replicas }}
      - status.storage.replication.factor={{ .Values.kafka.topic.replicas }}
      - confluent.balancer.topic.replication.factor={{ .Values.kafka.topic.replicas }}
      - confluent.security.event.logger.exporter.kafka.topic.replicas={{ .Values.kafka.topic.replicas }}
      - confluent.license.topic.replication.factor={{ .Values.kafka.topic.replicas }}
      - auto.create.topics.enable={{ .Values.kafka.topic.autocreate }}
      - confluent.cluster.link.enable={{ .Values.kafka.clusterLink }}
      - confluent.balancer.enable={{ .Values.kafka.balancer }}
---
{{- if .Values.kafka.serviceAccount.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.kafka.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
{{- if .Values.kafka.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml .Values.kafka.imagePullSecrets | nindent 2 }}
{{- end }}
{{- end }}
---
{{- if and .Values.kafka.listeners.tls.enabled .Values.kafka.listeners.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls-internal
  namespace: {{ .Release.Namespace }}
spec:
  secretName: kafka-tls-internal
  duration: {{ .Values.kafka.listeners.tls.certManager.duration | default "2160h" }}
  renewBefore: {{ .Values.kafka.listeners.tls.certManager.renewBefore | default "360h" }}
  commonName: {{ .Values.kafka.listeners.tls.advertisedHost | default (printf "kafka-tls.%s.svc.cluster.local" .Release.Namespace) }}
  dnsNames:
    - {{ .Values.kafka.listeners.tls.advertisedHost | default (printf "kafka-tls.%s.svc.cluster.local" .Release.Namespace) }}
    - kafka-tls.{{ .Release.Namespace }}.svc.cluster.local
    - kafka-tls.{{ .Release.Namespace }}.svc
    - kafka-tls.{{ .Release.Namespace }}
    - kafka-tls
    {{- range $i := until (.Values.kafka.replicas | int) }}
    - kafka-{{ $i }}.kafka.{{ $.Release.Namespace }}.svc.cluster.local
    - kafka-{{ $i }}.kafka.{{ $.Release.Namespace }}
    {{- end }}
  issuerRef:
    name: {{ .Values.kafka.listeners.tls.certManager.issuerRef }}
    kind: {{ .Values.kafka.listeners.tls.certManager.issuerKind | default "ClusterIssuer" }}
{{- end }}
