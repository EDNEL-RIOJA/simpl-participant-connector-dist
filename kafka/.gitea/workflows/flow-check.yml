name: Branch Flow Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - env/stage
      - env/test
      - env/prod
jobs:
  check-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion flow
        run: |
          CHAIN=(env/dev env/stage env/test env/prod)
          T="${{ github.base_ref }}"
          S="${{ github.head_ref }}"

          IDX=-1
          for i in "${!CHAIN[@]}"; do
            if [ "${CHAIN[$i]}" = "$T" ]; then
              IDX=$i
              break
            fi
          done

          CHAIN_STR=$(IFS=' -> '; echo "${CHAIN[*]}")

          if [ "$IDX" -le 0 ]; then
            echo "OK: '$T' no tiene paso previo definido en este flujo, nada que comprobar."
            echo "Flujo de este repo: $CHAIN_STR"
            exit 0
          fi

          EXPECTED="${CHAIN[$((IDX-1))]}"

          if [ "$S" != "$EXPECTED" ]; then
            echo "::error::Flujo de promocion incorrecto: se esperaba '$EXPECTED' -> '$T', se recibio '$S' -> '$T'"
            echo ""
            echo "Flujo de promocion de este repo: $CHAIN_STR"
            echo ""
            echo "Esta PR intenta fusionar '$S' dentro de '$T'."
            echo "Pero para llegar a '$T' hace falta venir de '$EXPECTED', no de '$S'."
            echo ""
            echo "Que falta por hacer: abre (o localiza) la PR '$EXPECTED' -> '$T' y fusiona esa primero."
            exit 1
          fi

          echo "Flow check OK: '$S' -> '$T'"
          echo "Flujo completo de este repo: $CHAIN_STR"
