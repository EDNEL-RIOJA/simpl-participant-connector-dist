apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Values.deployment.label }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deployment.label }}
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-image: "ghcr.io/cnie-es/openbao:2.4.3"
        vault.hashicorp.com/role: {{ .Values.hashicorp.role }}
        {{- if and (hasKey .Values "hashicorp") (hasKey .Values.hashicorp "service") }}
        vault.hashicorp.com/service: {{ .Values.hashicorp.service }}
        {{- end }}
        {{- /*
        CA del endpoint de OpenBao. Solo hace falta si vault.hashicorp.com/service apunta a
        un host HTTPS con certificado de CA privada: el vault-agent no la trae en su
        truststore y muere en "x509: certificate signed by unknown authority", sin llegar a
        arrancar el pod. tls-secret monta el Secret en /vault/tls y ca-cert dice cual usar.
        */}}
        {{- with .Values.hashicorp }}
        {{- if .tlsSecret }}
        vault.hashicorp.com/tls-secret: {{ .tlsSecret }}
        vault.hashicorp.com/ca-cert: {{ .caCert | default "/vault/tls/ca.crt" }}
        {{- end }}
        {{- end }}
        vault.hashicorp.com/agent-inject-secret-config.txt: "{{ tpl .Values.secretConfigPath . }}"
        vault.hashicorp.com/agent-inject-template-config.txt: |
          {{- $secretPath := tpl .Values.secretConfigPath . -}}
          {{- $template := printf (printf "{{`{{ with secret \"%s\" }}\n" $secretPath) -}}
          {{- $template = printf "%s{{ range $k, $v := .Data.data }}\n" $template -}}
          {{- $template = printf "%s  export {{ $k }}={{ $v }}\n" $template -}}
          {{- $template = printf "%s{{ end }}\n" $template -}}
          {{- $template = printf "%s{{ end }}`}}" $template -}}
          {{- tpl $template . | nindent 10 }}
      labels:
        app: {{ .Values.deployment.label }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-volume
          emptyDir: {}
        {{- if .Values.caBundle.enabled }}
        - name: ca-bundle
          configMap:
            name: {{ .Release.Name }}-ca-bundle
        - name: truststore
          emptyDir: {}
        {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Namespace }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.tls.url.participantIdSource .Values.caBundle.enabled }}
      initContainers:
      {{- end }}
      {{- if .Values.tls.url.participantIdSource }}
        - name: wait-for-participant-id
          volumeMounts:
            - name: config-volume
              mountPath: /config
          image: ghcr.io/cnie-es/curlimages-curl:8.18.0
          command: [ 'sh', '-c' ]
          args:
            - |
              while true; do
                echo "Checking if participantId is available..."
                response=$(curl -s -w "\n%{http_code}" {{ .Values.tls.url.participantIdSource }})
                status_code=$(echo "$response" | tail -n1)
                response_body=$(echo "$response" | sed '$d')

                if [ "$status_code" -eq 200 ]; then
                  # Extract participantId using grep and sed
                  participant_id=$(echo "$response_body" | grep -o '"participantId":"[^"]*' | sed 's/"participantId":"//')

                  if [ -n "$participant_id" ] && [ "$participant_id" != "null" ]; then
                    echo "$participant_id" > /config/participant-id
                    echo "Success: Retrieved participantId: $participant_id"
                    break
                  else
                    echo "Error: participantId not found in response"
                  fi
                else
                  echo "Expected 200 but got ${status_code}. Retrying in 60 seconds..."
                fi
                sleep 60
              done
              echo "Dependency check passed, starting main container..."
      {{- end }}
      {{- if .Values.caBundle.enabled }}
        # El cacerts de la imagen NO es escribible (el contenedor corre como uid no root), asi que
        # se copia a un emptyDir y se le añaden ahi las CA internas. Se reutiliza la imagen del
        # contenedor principal porque ya trae keytool: asi no se introduce una dependencia nueva.
        - name: build-truststore
          image: {{ .Values.deployment.image }}:{{ .Values.deployment.tag }}
          command: [ 'sh', '-ec' ]
          args:
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              chmod u+w /truststore/cacerts
              # Un fichero por certificado: keytool solo importa el primero de un PEM multiple.
              for f in /ca/*; do
                keytool -importcert -noprompt -alias "$(basename "$f")" \
                  -file "$f" -keystore /truststore/cacerts -storepass changeit
              done
              echo "CA internas importadas:"
              keytool -list -keystore /truststore/cacerts -storepass changeit | grep -i cnie || true
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca
            - name: truststore
              mountPath: /truststore
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-container
          image: {{ .Values.deployment.image }}:{{ .Values.deployment.tag }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
            {{- if .Values.caBundle.enabled }}
            - name: truststore
              mountPath: /truststore
            {{- end }}
          command: [ "/bin/sh" ]
          {{- if .Values.tls.url.participantIdSource }}
          # By providing this variable we want to export edc_participant_id from file /config/participant-id. See init container wait-for-participant-id.
          args: [ "-c", "source /vault/secrets/config.txt && export edc_participant_id=$(cat /config/participant-id) && java -jar /connector.jar" ]
          {{- else }}
          # If Values.tls.participantIdSource is not provided then we go with standard flow and edc_participant_id will be taken from values.yaml
          args: [ "-c", "source /vault/secrets/config.txt && java -jar /connector.jar" ]
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: web.http.port
              value: "{{ .Values.service.apiPort | default "29191" }}"
            - name: web.http.path
              value: "{{ .Values.ingress.apiPath | default "/api" }}"
            - name: web.http.management.port
              value: "{{ .Values.service.managementPort | default "29193" }}"
            - name: web.http.management.path
              value: "{{ .Values.ingress.managementPath | default "/management" }}"
            - name: web.http.protocol.port
              value: "{{ .Values.service.protocolPort | default "29194" }}"
            - name: web.http.protocol.path  
              value: "{{ .Values.ingress.protocolPath | default "/protocol" }}"
            - name: web.http.control.port
              value: "{{ .Values.service.controlPort | default "29192" }}"
            - name: web.http.control.path
              value: {{ .Values.ingress.controlPath | default "/control" }}
            - name: web.http.public.port
              value: "{{ .Values.service.publicPort | default "29291" }}"
            - name: web.http.public.path
              value: "{{ .Values.ingress.publicPath | default "/public" }}"
            {{- if .Values.ingress.publicEndpoint.baseUrl }}
            # External base URL of the dataplane public endpoint, announced to
            # counterparties in the EDR so the data pull resolves the public-be host.
            - name: edc.dataplane.api.public.baseurl
              value: {{ .Values.ingress.publicEndpoint.baseUrl | quote }}
            {{- end }}
            - name: edc.dsp.callback.address
              value: {{.Values.deployment.callbackAddress }}{{ .Values.ingress.protocolPath }}
            # by providing this url we want to fetch edc.participant.id from authentication provider -> see init container wait-for-participant-id.
            # if tls.participantIdSource is not provided then the edc.participant.id value from values.yaml is taken
            {{- if not .Values.tls.url.participantIdSource }}
            - name: edc.participant.id
              value: {{ .Values.env.edcParticipantId }}
            {{- end }}
            - name: edc.ids.id
              value: {{ .Values.env.edcIdsId }}
            - name: edc.mock.region
              value: "eu"
            - name: edc.datasource.default.url
              value: {{ .Values.env.datasourceurl }}
            - name: edc.datasource.default.user
              value: "{{ .Values.postgresql.username }}"
            - name: edc.datasource.policy.url
              value: {{ .Values.env.datasourceurl }}
            - name: edc.datasource.policy.user
              value: "{{ .Values.postgresql.username }}"
            - name: edc.sql.schema.autocreate
              value: "true"
            - name: client.authenticationprovider.url
              value: {{ .Values.tls.url.authenticationprovider }}
            - name: contractmanager.extension.enabled
              value: "{{ .Values.contractmanager.extension.enabled }}"
            {{- if .Values.contractmanager.extension.enabled }}
            {{- if .Values.contractmanager.url }}
            - name: contractmanager.url
              value: {{ .Values.contractmanager.url }}
            {{- end }}
            {{- if .Values.contractmanager.consumerUrl }}
            - name: contractmanager.consumer.url
              value: {{ .Values.contractmanager.consumerUrl }}
            {{- end }}
            {{- if .Values.contractmanager.providerUrl }}
            - name: contractmanager.provider.url
              value: {{ .Values.contractmanager.providerUrl }}
            {{- end }}
            {{- end }}

            {{- /* AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are already exported into the
                   environment by `source /vault/secrets/config.txt` (rendered from the
                   simpl-secrets/<ns>-simpl-edc OpenBao secret via the vault-agent sidecar).
                   Do NOT declare them here with a `vault:` prefix: that prefix triggers the
                   bank-vaults vault-env webhook, which defaults to vault.vault:8200 and
                   crashes the pod (x509 unknown authority). */}}
            {{- /* Todas las opciones de JVM van en UNA sola JAVA_TOOL_OPTIONS y no en los args
                   del contenedor, porque `args` tiene dos ramas segun tls.url.participantIdSource
                   y habria que duplicar el cambio en ambas. La JVM lee esta variable sola; a cambio
                   escribe una linea "Picked up JAVA_TOOL_OPTIONS" al arrancar, ruido inofensivo.

                   Antes habia DOS bloques que declaraban JAVA_TOOL_OPTIONS por separado (javadebug
                   y caBundle): con los dos activos se emitian dos entradas con el mismo nombre en
                   el mismo contenedor y solo ganaba la ultima. Ahora se acumulan en una lista.

                   maxRamPercentage: sin esto la JVM se queda con el 25% del limite del contenedor
                   (MaxRAMPercentage por defecto). Con limits.memory=500Mi el heap eran ~126 MB y
                   una transferencia S3 de 82 MB moria con OutOfMemoryError, porque el data plane
                   bufferea el objeto en memoria. */}}
            {{- $jvmOpts := list }}
            {{- $javadebug := .Values.javadebug | default dict }}
            {{- if $javadebug.enabled }}
            {{- $jvmOpts = append $jvmOpts (printf "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:%v" $javadebug.port) }}
            {{- end }}
            {{- if .Values.caBundle.enabled }}
            {{- $jvmOpts = append $jvmOpts "-Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit" }}
            {{- end }}
            {{- $pct := (.Values.jvm | default dict).maxRamPercentage }}
            {{- if $pct }}
            {{- $jvmOpts = append $jvmOpts (printf "-XX:MaxRAMPercentage=%v" $pct) }}
            {{- end }}
            {{- $freeOpts := (.Values.jvm | default dict).opts }}
            {{- if $freeOpts }}
            {{- $jvmOpts = append $jvmOpts $freeOpts }}
            {{- end }}
            {{- if $jvmOpts }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ join " " $jvmOpts | quote }}
            {{- end }}
            {{- /* Troceado multipart de S3. Nombres con puntos a proposito: se inyectan como
                   env de k8s y NO pasan por el `source /vault/secrets/config.txt`, que los
                   rechazaria como identificadores de bash. Comprobado (27/08/2026) que el
                   secreto de OpenBao del EDC no trae ninguna clave de chunk ni de session
                   duration -- solo credenciales AWS/S3 -- asi que no hay colision: si algun dia
                   se anade una, GANA la de Vault, porque el `source` corre DESPUES del env. */}}
            {{- $s3 := .Values.s3 | default dict }}
            {{- if not (kindIs "invalid" $s3.sinkChunkSizeMb) }}
            - name: edc.dataplane.aws.sink.chunk.size.mb
              value: "{{ $s3.sinkChunkSizeMb }}"
            {{- end }}
            {{- if not (kindIs "invalid" $s3.chunkSizeBytes) }}
            - name: edc.aws.s3.chunk.size.bytes
              value: "{{ $s3.chunkSizeBytes }}"
            {{- end }}
            {{- if not (kindIs "invalid" $s3.sessionDurationSeconds) }}
            - name: edc.aws.s3.session.duration.seconds
              value: "{{ $s3.sessionDurationSeconds }}"
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.apiPort | default "29191" }}
              name: api-port
            - containerPort: {{ .Values.service.protocolPort | default "29194" }}
              name: protocol-port
            - containerPort: {{ .Values.service.managementPort | default "29193" }}
              name: management-port
            - containerPort: {{ .Values.service.publicPort | default "29291" }}
              name: public-port
            - containerPort: {{ .Values.service.controlPort | default "29192" }}
              name: control-port
      {{- with .Values.nodeSelector }}
      # c1/on-prem: el data plane habla S3 contra the storage backend, y NO todos los workers tienen ruta a la red
      # de almacenamiento. Sin fijar nodo, el pod cae al azar y en los que no la tienen falla con
      # NoRouteToHostException. Ver app-values.
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
