# service port
servicePort: 8080

# container port
containerPort: 8080

# specify 'dev' for dev environment or 'int' for integration environment
domainUrlEnvIdentifier: dev

# domain associated with Dev Cluster (don't modify it)
domain: example.org

log4j:
  config:
    # to override log4j2.component.properties entry named log4j2.configurationFile
    # to add log4j2-app.xml created by configmap.yaml into the folder config mounted by deplyment.yaml
    file: classpath:log4j2.xml,file:/config/log4j2-app.xml
  # config file monitoring interval for hot changes (seconds)
  monitorInterval: 10
  level:
    # logging level for all logs excluding the specific ones
    root: INFO
    # logging level for application components only
    app: INFO
    # logging level for feign clients only
    feign: INFO

# comma separated list of servers url to be used by swagger
openapiConfig:
  servers: https://edc-connector-adapter.example.org

openTelemetry:
  # disables the OpenTelemetry SDK (true on local dev)
  disabled: true
  # used to identify the environment
  environment: local-dev
  # used to identify the service (to append '-provider' or '-consumer' suffix)
  service: edc-connector-adapter
  otlpExporter:
    # collector endpoint for the OTLP exporter
    endpoint: http://collector-common01.example.org
    # protocol used by the OTLP exporter (http/protobuf or grpc)
    protocol: http/protobuf
  # context propagation type
  propagators: tracecontext

# resources configuration
resources:
  requests:
    cpu: "100m"
    memory: "0Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# replicas used ONLY when autoscaling.enabled = false
replicaCount: 1

# horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false                  # Set true to enable HPA
  minReplicas: 1                  # Minimum number of pods
  maxReplicas: 5                  # Maximum number of pods
  targetCPUUtilizationPercentage: 75  # CPU % threshold based on requests
  # Optional: memory autoscaling (uncomment if needed)
  # targetMemoryUtilizationPercentage: 80
  # behavior:
    #   scaleUp:
    #     stabilizationWindowSeconds: 60
    #     policies:
    #       - type: Percent
    #         value: 100
    #         periodSeconds: 60
    #   scaleDown:
    #     stabilizationWindowSeconds: 300
    #     policies:
    #       - type: Percent
    #         value: 100
    #         periodSeconds: 60

ingress:
  # enable ingress only for development purpose
  # on production environment this service must be exposted through the participant tier1 gateway only
  enabled: false
  clusterIssuer: dev-prod
  # tls.secretName vacio = Let's Encrypt per-host (default); con valor = usa ese
  # Secret/SealedSecret TLS (p.ej. "vallelengua-tls") y NO emite con LE. Ver tier1-gateway.
  tls:
    secretName: ""
  ingressClass: apisix

image:
  repository: "ghcr.io/cnie-es/data1-edcconnectoradapter"
  pullPolicy: IfNotPresent
  tag: "1.15.0"
imagePullSecrets:
- name: github-registry-secret

web:
  mvc:
    cors:
      # optional allowed origins for cross calls (list separated by comma or * to allow all origins)
      # if empty no cross calls are allowed
      allowedOrigins: ""

    bearerToken:
      # if true a JWT token must be present as Bearer in any request
      required: true
      # optional list (comma separated) of allowed paths (ant matcher expressions) to skip JWT token check (ex: actuator health paths)
      allowedPaths: "/actuator/health/*"

# application profile (provider or consumer)
profile: provider

#########################################################################
# 'provider' profile only
#########################################################################

edcConnector:
  # url to the provider EDC connector (internal service)
  baseUrl: https://edc-provider.example.org
  # tier2 url to the provider EDC connector service behind the TLS gateway (ending with the route context name)
  # this will be enriched in the SD json by enrichAndValidate API
  #tier2BaseUrl: https://tls.participant.provider.dev.simpl-europe.eu/edc
  tier2BaseUrl: https://edc-provider.example.org/protocol
  # the participant id to be used as assigner in policies as expected by the EDC connector on contract negotiation
  # this value can be obtained from the EDC connector configuration of the dataprovider participant
  # in OVH: deployment > config > env > edc.participant.id
  participantId: provider
  
  
#########################################################################
# 'consumer' profile only
#########################################################################

