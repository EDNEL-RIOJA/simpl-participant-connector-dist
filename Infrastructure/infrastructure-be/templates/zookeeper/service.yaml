{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "infra-backend.fullname" . }}-zookeeper-svc
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.zookeeper.service.type }}
  ports:
    - port: {{ .Values.zookeeper.service.clientPort }}
      targetPort: {{ .Values.zookeeper.service.clientPort }}
      name: client
    - port: {{ .Values.zookeeper.service.quorumPort }}
      targetPort: {{ .Values.zookeeper.service.quorumPort }}
      name: quorum
    - port: {{ .Values.zookeeper.service.electionPort }}
      targetPort: {{ .Values.zookeeper.service.electionPort }}
      name: election
  selector:
    app: {{ .Chart.Name }}
{{- end }}    