# Default values for infra-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: infrastructure

backend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/cnie-es/infrastructure-infrastructure-be
    tag: 1.3.4
  env:
    SPRING_MAIL_HOST: smtp.ionos.de
    SPRING_MAIL_PORT: '587'
    SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: 'true'
    SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: 'false'
    SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: 'true'
    SPRING_CLOUD_VAULT_TOKEN: xxxxxxxxxxxxxxxxxxx
    SPRING_CLOUD_VAULT_URI: http://vault-infrastructure.infrastructure.svc.cluster.local:8200
    SPRING_CLOUD_VAULT_KV_ENABLED: 'true'
    SPRING_CONFIG_IMPORT: vault://kv/infrastructure-be
    SPRING_CLOUD_VAULT_KV_VERSION: '2'
    SPRING_CLOUD_VAULT_URL: http://vault-infrastructure.infrastructure.svc.cluster.local:8200/v1/kv/data/users/
    SERVER_PORT: '8081'
    KAFKA_PROVISIONING_REQUESTS_TOPIC_NAME: to-provision
    KAFKA_PROVISIONING_RESPONSES_TOPIC_NAME: provisioned
    KAFKA_DECOMMISSIONING_REQUESTS_TOPIC_NAME: to-decommission
    KAFKA_DECOMMISSIONING_RESPONSES_TOPIC_NAME: decommissioned
    ALLOWED_ORIGINS: http://localhost:3001,https://fe.infrastructure.dev.simpl-europe.eu
    OTEL_EXPORTER_OTLP_ENDPOINT: http://collector.common01.dev.simpl-europe.eu
  imagePullSecrets:
  - name: github-registry-secret
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podSecurityContext: {}

  securityContext: {}
  resources:
    limits:
      cpu: 100m
      memory: 1Gi
    requests:
      cpu: 25m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}

    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

postgres:
  enabled: true
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: postgres
    tag: 16-alpine3.18
  env:
    POSTGRES_DB: scripts-db
    POSTGRES_USER: ionos-script
    POSTGRES_PASSWORD: { postgres_password }
  imagePullSecrets:
  - name: github-registry-secret
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: postgres-data

  nodeSelector: {}
  tolerations: []
  affinity: {}

  service:
    type: ClusterIP
    port: 5432

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

kafka:
  replicaCount: 1
  enabled: true
  
  image:
    repository: ghcr.io/cnie-es/confluentinc-cp-kafka
    tag: 1.0.0
    pullPolicy: IfNotPresent

  resources:
    limits:
      memory: 4Gi
      cpu: 2
    requests:
      memory: 2Gi
      cpu: 1

  kafkaConfig:
    brokerId: 1
    listenerSecurityProtocolMap: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    autoCreateTopicsEnable: false
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    minInsyncReplicas: 1
    jmxPort: 9997

  service:
    type: ClusterIP
    port: 9092
    internalPort: 29092
    jmxPort: 9997

zookeeper:
  replicaCount: 3

  image:
    repository: ghcr.io/cnie-es/confluentinc-cp-zookeeper
    tag: 1.0.0
    pullPolicy: IfNotPresent

  resources:
    limits:
      memory: 2Gi
      cpu: 1
    requests:
      memory: 1Gi
      cpu: 500m

  service:
    type: ClusterIP
    clientPort: 2181
    electionPort: 3888
    quorumPort: 2888

  zookeeperConfig:
    tickTime: 2000
    initLimit: 10
    syncLimit: 5
    dataDir: /var/lib/zookeeper/data
    clientPort: 2181

kafkaUi:
  replicaCount: 1

  image:
    repository: ghcr.io/cnie-es/provectuslabs-kafka-ui # No en ghcr.io
    tag: 1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

  kafkaClusters:
    - name: "local"
      bootstrapServers: "infrastructure-backend-kafka-svc.infrastructure.svc.cluster.local:29092"
      metricsPort: 9997
      dynamicConfigEnabled: true

  nodeSelector: {}
  tolerations: []
  affinity: {}