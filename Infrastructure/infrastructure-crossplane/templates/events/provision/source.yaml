apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: provision
  namespace: {{ .Release.Namespace }}
spec:
  eventBusName: provisioner-eventbus
  kafka:
    provisionRequest:
      url: {{ .Values.kafkaEndpoint }}
      topic: {{ .Values.kafkaProvisioningRequestsTopicName }}
      jsonBody: false
      partition: "0"
      {{- if .Values.kafkaAuthEnable }}
      sasl:
        mechanism: {{ .Values.kafkaAuthMechanism }}
        userSecret:
          name: kafka-secret
          key: username
        passwordSecret:
          name: kafka-secret
          key: password
      {{- end }}
      connectionBackoff:
        duration: 10s
        steps: 3
        factor: 1
        jitter: 0.2