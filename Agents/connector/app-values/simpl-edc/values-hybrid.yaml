# Perfil HIBRIDO: un unico conector EDC que actua como PROVIDER y CONSUMER a la vez.
# El rol no se fija en despliegue: EDC lo decide por negociacion (ContractNegotiation.Type).
# Ver contractmanager.consumerUrl/providerUrl en values.yaml (enrutado por rol al CM).

deployment:
  # Se mantiene "provider" (no "hybrid") porque el selector del Deployment es inmutable en k8s:
  # cambiarlo obligaria a borrar/recrear el Deployment existente en cada entorno.
  label: provider

# Un solo set de puertos. El split 19xxx/29xxx solo existia para co-ubicar dos instancias;
# con conector unico se conservan los 19xxx a los que ya apuntan todos los componentes provider.
service:
  apiPort: 19191
  controlPort: 19192
  managementPort: 19193
  protocolPort: 19194
  publicPort: 19291

ingress:
  tlsSecretName: provider-simpl-backend-tls

# it would be better to move those to vault in the future or use sops encryption
env:
  # Identidad unica del conector para ambos roles (DSP soporta una identidad en los dos).
  # Se conserva el edcIdsId ya registrado; el participantId real viene de participantIdSource.
  edcIdsId: "urn:connector:provider"
