profile: participant

# Spring Cloud Gateway Routes Participant
appConfig:
  external-routes:
    spring-route-definitions:
      - id: contract-consumption-be
        uri: http://contract-consumption-be:8080
        predicates:
          - Path=/contract-consumption/**
        filters:
          - StripPrefix=1
      - id: sdtooling-wizard-be
        uri: http://sd-creation-wizard-api:8080
        predicates:
          - Path=/sdtooling-api/**
        filters:
          - StripPrefix=1
      - id: xfsc-advsearch-be
        uri: http://xfsc-advsearch-be:8080
        predicates:
          - Path=/xfsc-advsearch-be/**
        filters:
          - StripPrefix=1
      - id: edc-connector
        uri: http://edc-connector-adapter:8080
        predicates:
          - Path=/edc-connector-adapter/**
        filters:
          - StripPrefix=1
      - id: edc-connector-consumer
        uri: http://edc-connector-adapter-consumer:8080
        predicates:
          - Path=/edc-connector-adapter-consumer/**
        filters:
          - StripPrefix=1
      - id: signer
        uri: http://signer:8080
        predicates:
          - Path=/signer/**
        filters:
          - StripPrefix=1
      - id: infra-be
        uri: http://infrastructure-be-infrastructure-be-api-svc
        predicates:
          - Path=/infra-be/**
        filters:
          - StripPrefix=1
      - id: edc-management
        uri: http://simpl-edc-service:19193
        predicates:
          - Path=/edc/**
        filters:
          - StripPrefix=1
      - id: datadashboard-be
        uri: http://authentication-provider:8080
        predicates:
          - Path=/datadashboardApi/**
        filters:
          - StripPrefix=1
    public-urls:
      - method: "GET"
        path: "/actuator/health/**"
      - method: GET
        path: "/sdtooling-api/swagger-ui/**"
      - method: GET
        path: "/sdtooling-api/api-docs/**"
      - method: GET
        path: "/sdtooling-api/status"
    denied-urls:
      - method: "POST"
        path: "/datadashboardApi/tier1/v2/credentials/validate"
      - method: "GET"
        path: "/datadashboardApi/tier1/v2/credentials/{credentialId}/participant"
      - method: "GET"
        path: "/datadashboardApi/tier1/v2/ephemeralProof"
      - method: "GET"
        path: "/datadashboardApi/tier1/v2/keypairs/active"
      - method: "GET"
        path: "/datadashboardApi/tier1/v2/participants/{participantId}/identityAttributes"
      - method: "POST"
        path: "/datadashboardApi/tier1/v2/tierOneCredentials/validate"
      - method: "POST"
        path: "/datadashboardApi/v1/agent/credentials/validate"
      - method: "GET"
        path: "/datadashboardApi/v1/agent/ephemeralProof"
      - method: "GET"
        path: "/datadashboardApi/v1/keypairs"
      - method: "POST"
        path: "/datadashboardApi/v1/mtls/ephemeralProof"
      - method: "GET"
        path: "/datadashboardApi/v1/mtls/ping"
      - method: "POST"
        path: "/datadashboardApi/v1/sessions/credentials"
      - method: "GET"
        path: "/datadashboardApi/v1/sessions/identityAttributes"
    rbac:
      - path: "/edc-connector-adapter/api/*/registration/register"
        method: GET
        roles:
          - SD_PUBLISHER
      - path: "/edc-connector-adapter/api/*/configuration/participant"
        method: POST
        roles:
          - SD_PUBLISHER
      - path: "/sdtooling-api/**"
        method: GET
        roles:
          - SD_PUBLISHER
      - path: "/sdtooling-api/**"
        method: POST
        roles:
          - SD_PUBLISHER
      - path: "/datadashboardApi/tier1/v2/participant"
        method: "GET"
        roles:
          - "SD_PUBLISHER"
          - "SD_CONSUMER"
      - path: "/datadashboardApi/tier1/v2/participants/{participantId}"
        method: "GET"
        roles:
          - "SD_PUBLISHER"
          - "SD_CONSUMER"

  springdoc:
    swagger-ui:
      urls:
        - url: /userApi/openapi/usersroles-v1.yaml
          name: Users & Roles Service V1
        - url: /authApi/openapi/authenticationprovider-v1.yaml
          name: Authentication Provider Service V1
        - url: /openapi/tier1gateway-v1.yaml
          name: Application Info V1

  keycloak:
    app:
      realm: participant