image:
  # c1/on-prem: Harbor (este app-values pisa el repository del chart; con registry=harbor del
  # chart, "cnie-es/keycloak" daba harbor.c0.example.invalid/ednel-rioja/k8s-images
  # /keycloak -> proyecto inexistente -> 401). Harbor c1-apps permite pull anónimo.
  # ghcr.io/cnie-es/keycloak es privado: un participante externo sin credenciales no puede pullarlo
  # (bloqueado para toda la publicacion de los 9 EDVAL, ver SEGUIMIENTO-conector-externo.md).
  # NO usar quay.io/keycloak/keycloak (imagen oficial, no-Bitnami) tampoco: este chart es el de
  # Bitnami (vendor/keycloak) y su init container "prepare-write-dirs" asume la estructura interna
  # de Bitnami (/opt/bitnami/scripts/liblog.sh, /opt/bitnami/keycloak/...) — con la oficial falla
  # con "No such file or directory" (visto en vivo en extletest/eks-external-rioja).
  # bitnamilegacy es el archivo publico congelado tras el cierre del catalogo gratuito de
  # Bitnami/Broadcom (mismo patron que redis/redis-exporter en este repo): mismo layout Bitnami,
  # accesible sin token.
  registry: docker.io
  repository: bitnamilegacy/keycloak
  # Tag explicito (el default del chart, 26.3.2, tambien existe en bitnamilegacy, pero se fija el
  # exacto ya usado y verificado en el repo historico de EDNEL-RIOJA).
  tag: "26.3.2-debian-12-r2"
# Chart 25.2.0: imagePullSecrets y allowInsecureImages se leen bajo global.* (no top-level).
global:
  # c1/on-prem: SIN imagePullSecrets — Harbor c1-apps es de pull anónimo y el github-registry-secret
  # ni existe en el ns del participante (daba FailedToRetrieveImagePullSecret). Ver flag general.
  imagePullSecrets: []
  security:
    allowInsecureImages: true
# vault-env solo resuelve referencias "vault:" en variables de entorno, no en ficheros, así que
# hay que desactivar el montaje de credenciales como ficheros (default true en 25.2.0).
usePasswordFiles: false

auth:
  adminUser: "admin" # update

postgresql:
  enabled: false

externalDatabase:
  annotations: {}
  existingSecret: ""
  existingSecretDatabaseKey: ""
  existingSecretHostKey: ""
  existingSecretPasswordKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  port: 5432

extraVolumes:
  - name: spi-volume
    emptyDir: {}
  - name: realm-volume
    emptyDir: {}
  - name: realm-config-volume
    emptyDir: {}
  - name: theme-volume
    emptyDir: {}

extraVolumeMounts:
  - name: spi-volume
    mountPath: /opt/bitnami/keycloak/providers/keycloak-authenticator.jar
    subPath: keycloak-authenticator.jar
  - name: realm-volume
    mountPath: /opt/bitnami/keycloak/data/import/realm.json
    subPath: realm.json
  - name: theme-volume
    mountPath: /opt/bitnami/keycloak/providers/keycloakify-starter.jar
    subPath: keycloakify-starter.jar