{{- if .Values.secrets.authorityCaBundle }}
{{- /*
CA que firma el certificado de la AUTHORITY contra la que se onboarda este participante, aportada
en values (secrets.authorityCaBundle) para el perfil externo. Mismo patron que vault-ca-secret.yaml
(secrets.caBundle), pero para el host de la authority en vez del de OpenBao: son dos CAs distintas
y no hay que confundirlas.

Pensado para onboardarse contra una authority servida con una CA interna (p. ej. "CNIE Internal
CA", la que firma los hosts *.cnie.internal de vc-c1-dev/stage/prod) desde un cluster
VERDADERAMENTE externo que llega a ella por un tunel, no por la red interna real — el pod no
confia en esa CA por defecto y cualquier llamada HTTPS del participante a la authority falla con
"certificate signed by unknown authority" aunque el tunel de red funcione.

PENDIENTE (no resuelto en este cambio): esta Secret solo CREA el material de confianza. Montarlo
en el trust store de cada componente que llama a la authority (simpl-contract via
catalogSearch/catalogGet, simpl-edc via tls-authority-*, tier1-gateway/tier2-gateway/tier2-proxy
via authorityUrlT1/authorityHostT2) requiere que CADA chart de esos 9 componentes soporte algo
como extraVolumes/extraVolumeMounts o un NODE_EXTRA_CA_CERTS/SSL_CERT_FILE equivalente. No se pudo
verificar: los 9 repos cnie-es/* son privados y no hay hoy un token con read:packages que permita
leer sus charts (ver SEGUIMIENTO-conector-externo.md). Falta, componente a componente, confirmar
el mecanismo real y wirearlo aqui.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-authority-ca" .Values.cluster.namespace }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ca.crt: |
{{ .Values.secrets.authorityCaBundle | indent 4 }}
{{- end }}
