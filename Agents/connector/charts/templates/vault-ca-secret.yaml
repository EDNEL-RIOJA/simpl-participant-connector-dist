{{- if and .Values.secrets.caBundle (not .Values.secrets.tlsSecret) }}
{{- /*
CA del endpoint de OpenBao, aportada en values (secrets.caBundle) en vez de referenciada.
Pensado para el participante externo: no tiene el private-ca-tls que el gitops emite en
los namespaces internos, asi que se trae la suya. Sync-wave -1: tiene que existir antes de
que arranque nada que lea secretos, o vault-env vuelve a fallar el handshake.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-vault-ca" .Values.cluster.namespace }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ca.crt: |
{{ .Values.secrets.caBundle | indent 4 }}
{{- end }}
